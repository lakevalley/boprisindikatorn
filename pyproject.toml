[project]
name = "boprisindikatorn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lakevalley", email = "lakevalleymalmo@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "folium>=0.20.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scikit-learn==1.9.0",
    "streamlit>=1.63.0",
    "streamlit-folium>=0.27.4",
    "streamlit-searchbox>=0.1.24",
]

[project.scripts]
boprisindikatorn = "boprisindikatorn:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
